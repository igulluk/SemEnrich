clustering:
  algorithm: kmeans
  max_iter: 300
  n_clusters: 5000
  n_init: 10
  random_seed: 42

data:
  data_path: ./data
  feature_dir: ./extracted_features
  n_samples: 300000
  subset_name: subset_300000

evaluation:
  metrics:
  - silhouette
  - davies_bouldin
  - calinski_harabasz
  visualization: true
  visualization_methods:
  - tsne
  - pca

output:
  output_dir: ./experiments/outputs/clustering
  save_cluster_mapping: true
  save_cluster_to_texts: true
  save_metrics: true
  save_prefix: kmeans_K5000
  save_visualizations: true
