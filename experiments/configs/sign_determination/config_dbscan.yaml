sign_determination:
  method: llm
  llm:
    provider: deepseek
    model: deepseek-chat
    api_key: .
    temperature: 0.9
output:
  save_signs: true
  save_examples: true
  n_examples: 50
  output_dir: ./experiments/outputs/clustering
  save_prefix: dbscan
clustering:
  cluster_file: ./experiments/outputs/clustering/dbscan_clusters.json
  cluster_to_texts_file: ./experiments/outputs/clustering/dbscan_cluster_to_texts.json
