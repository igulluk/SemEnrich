# Training Configuration for Medical Report Generation

optimizer:
  learning_rate: 0.00005     
  adam_eps: 1.0e-08
  adam_weight_decay: 0.01
  adam_betas: [0.9, 0.999]
  warmup_steps: 2000
  max_steps: 450000 


LLM:
  cache_dir: .
  # model_name: 'chaoyi-wu/PMC_LLAMA_7B'   ###bsize 16
  # model_name: 'meta-llama/Meta-Llama-3-8B'  ###bsize 10
  model_name: meta-llama/Llama-3.1-8B  ###bsize 10
  # model_name: google/gemma-2-9b  ###bsize 10
  # model_name: google/gemma-2-9b-it  ###bsize 10
  # model_name: bigscience/bloom-7b1 ## bsize 8 
  # model_name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
  # model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  seq_length: 256


rexgrad:
  main_path: './data'

dataset_list : [
    'rexgrad-only-findings',
]

num_devices: 2
wandb_folder_path : ./wandb
image_size: [224, 224]
num_workers: 16
prefetch_factor: 3
checkpoint_dirpath: './checkpoints'
max_epochs: 35
lora_rank: 8

project: 'Project-Name'
experiment_name: 'Experiment-Name'
img_token_num: 2
ckpt_path: ''

batch_size: 128
accumulation: 1

is_inference: False 

vision_module: BiomedCLIP
n_inference_lim: 1000
cluster_files_dir: ./experiments/outputs/clustering
expansion_files_dir: ./experiments/outputs/expansion
inference_out_dir: ./inference_outputs


