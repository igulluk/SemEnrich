clustering:
  algorithm: dbscan
  eps: 0.5
  metric: euclidean
  min_samples: 5
  random_seed: 42

data:
  data_path: ./data
  feature_dir: ./extracted_features
  n_samples: 300000
  subset_name: subset_300000

evaluation:
  metrics:
  - silhouette
  - davies_bouldin
  - calinski_harabasz
  visualization: true
  visualization_methods:
  - tsne
  - pca

output:
  output_dir: ./experiments/outputs/clustering
  save_cluster_mapping: true
  save_cluster_to_texts: true
  save_metrics: true
  save_prefix: dbscan_N300k
  save_visualizations: true
